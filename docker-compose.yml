services:
  postgres:
    image: postgres:16-alpine
    container_name: music-player-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: music_player
      POSTGRES_USER: music_player
      POSTGRES_PASSWORD: music_player_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_player -d music_player"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: music-player-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/MusicPlayer.Api/Dockerfile
    container_name: music-player-api
    restart: unless-stopped
    ports:
      - "5116:5116"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5116
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=music_player;Username=music_player;Password=music_player_password
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=local-development-secret-key-for-music-player-api-2026
      - Jwt__Issuer=MusicPlayer.Api
      - Jwt__Audience=MusicPlayer.Android
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
